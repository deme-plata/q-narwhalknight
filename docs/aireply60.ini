        let doubled = point.double();
        
        // Verify doubling formula
        let expected_x = FieldElement::new(2) * (point.x * point.x) - FieldElement::one();
        let expected_y = FieldElement::new(2) * (point.x * point.y);
        
        assert_eq!(doubled.x, expected_x);
        assert_eq!(doubled.y, expected_y);
