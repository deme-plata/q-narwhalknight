## 2. Phase 1: FROST, Circle STARKs, AEGIS-256

### 2.1 FROST Threshold Signatures

**Good:**

* API is idiomatic and roughly aligned with common Rust FROST implementations (round-separated, explicit commitments, aggregation step).
* You note rogue-key and nonce-reuse issues explicitly, and you support identifiable abort, which is crucial in a consensus setting.

**Things to tighten:**

1. **Quantum security classification**

   Your table lists:

   > FROST (Ed25519) — Classical: 128-bit, Quantum: ~64-bit, Status: ⚠️ Needs PQ variant

   In the standard “Shor exists” threat model, *any* Schnorr/Ed25519-based scheme is **not quantum-secure at all**, not “64-bit secure”. The ~64-bit number comes from *Grover-style* quadratic speedups on brute-force, but Shor completely breaks discrete log.

   I’d suggest:

   * Label quantum security as **“Broken under generic large-scale quantum computers (Shor)”** instead of a bit-estimate.
   * Keep the ⚠️ status and explicitly say “must be phased out or wrapped in a hybrid PQ scheme on any long-horizon chain”.

2. **Key-generation model**

   * Right now you only describe *trusted dealer* keygen (`generate_shares`). For your threat model (permissioned committee, bridges, governance), that may be okay, but it’s worth planning for **distributed key generation (DKG)** as a Phase-2.5 upgrade, so you don’t bake in a permanent “dealer” trust assumption.

3. **Nonce management**

   * You mention cached nonces cleared after use. In practice, in a long-running validator node, I’d strongly recommend:

     * Using a **deterministic nonce (RFC 6979-style) or nonce PRF** keyed per signer and per message hash, *or*
     * A hardened nonce store that’s crash-safe and guarantees one-shot usage even across restarts.
   * Any bug here is “catastrophic” for key leakage.

4. **Curves / groups**

   * You already depend on `frost-ed25519` and `frost-ristretto255`. Given your longer-term PQ story, it may be worth designing your FROST abstraction so you can swap the underlying group (e.g., BLS for easier aggregation or eventually PQ groups) without rewriting all of consensus.

### 2.2 Circle STARKs

You’re broadly aligned with the actual construction:

* Field ( \mathbb{F}_p ) with (p = 2^{31} - 1).
* “Circle group” on (x^2 + y^2 = 1) with fast doubling.
* FRI over circle domain with the “(f(x) + \alpha f(-x))/2” type folding.

This matches what’s described in ePrint 2024/278 and follow-up work. ([RareSkills][1])

**Suggestions:**

1. **Hash / Fiat–Shamir choice**

   * In practice, Circle STARK implementations are standardizing on **field-friendly hash functions like RPO-M31 and XHash-M31** to avoid conversions between field and bitstrings and to align security analyses. ([ResearchGate][4])
   * Your doc mentions SHA3-256. That’s fine for a prototype, but I’d add a note that production deployments should track the same hashes as the broader Circle STARK ecosystem to benefit from shared analysis and tooling.

2. **API ergonomics**

   ```rust
   pub fn prove<F>(&self, trace: &[Vec<u64>], constraints: F)
   ```

   * Passing raw `u64` for field elements is error-prone; consider a `FieldElem(u32)` or `FieldElem(u64)` wrapper that enforces reduction mod (p) in constructors and arithmetic.
   * You might also want a `CircleDomainElement` type for points in the domain so you don’t accidentally mix indices and group elements.

3. **Security parameters**

   * Your proof size table (10× improvement over traditional STARKs) is plausible, but I would tie `log_trace_size`, `num_queries`, and `fri_layers` explicitly to a **target soundness error** (e.g., 2⁻¹²⁸).
   * It’s worth writing down a mapping: “For 2^k trace and security λ, choose q, d, num_queries = …” so consensus code doesn’t accidentally run with “dev-mode” parameters in production.

4. **Integration risk**

   * Circle STARKs are very new. Having them as a **feature-flagged “zk-fastpath”** while keeping a more conservative/older proof system (or even no ZK, just plain validation) as a fallback is a good safety valve.

### 2.3 AEGIS-256 AEAD

AEGIS-256 as high-performance AEAD is exactly in line with CFRG’s current drafts. ([IETF][2])

**Good:**

* 256-bit key, 256-bit nonce: matches the spec.
* Streaming API for large data is the right abstraction.
* Benchmarks showing ~2–3× over AES-GCM are consistent with published numbers on AES-NI hardware. ([GitHub][5])

**But: the use-cases need tightening.**

1. **Database / disk encryption**

   * AEGIS is an AEAD, designed primarily for **message-oriented encryption with unique nonces**. Using it for something like RocksDB block encryption is possible, but:

     * You must carefully specify how nonces are derived from `(file_id, block_index, version)`.
     * Nonce reuse under the *same key* is **not** something you should treat as “partially safe” in real deployments, even though the design is more robust than GCM. Treat it as a serious misuse to be avoided, not a feature.
   * You might want a separate “disk encryption mode” (XTS over AES, or XChaCha20-Poly1305 with sector-based nonces) if you need transparent at-rest encryption with rekeying and compaction.

2. **Nonce size and encoding**

   * Your `AegisNonce([u8; 32])` is correct for AEGIS-256, but you should specify exactly how it’s derived:

     * Example: `nonce = H(key_id || context || message_counter)` truncated to 256 bits.
   * The spec draft emphasizes **distinct (key, nonce) pairs per message**; you should echo that requirement prominently in your docs. ([IETF][2])

3. **Quantum security table**

   * 256-bit key ⇒ ~128-bit security under Grover, that’s fine. Just keep in mind that if you ever allow 128-bit AEGIS modes, the quantum margin halves.

