    #[test]
    fn test_circle_stark_basic() -> Result<()> {
        let trace = generate_fibonacci_trace(8);
        
        let prover = CircleStarkProver::new(3, 4, 4)?;
        
        // Fibonacci constraints: next[0] = curr[1], next[1] = curr[0] + curr[1]
        let constraints = |curr: &[FieldElement], next: &[FieldElement]| -> Vec<FieldElement> {
            vec![
                next[0] - curr[1],                    // next[0] should equal curr[1]
                next[1] - (curr[0] + curr[1]),        // next[1] should equal curr[0] + curr[1]
            ]
        };
        
        let proof = prover.prove(&trace, constraints)?;
        
        let verifier = CircleStarkVerifier::new(3, 4);
        assert!(verifier.verify(&proof)?);
        
        Ok(())
    }
