        let a = FieldElement::new(10);
        let b = FieldElement::new(20);
        
        assert_eq!(a + b, FieldElement::new(30));
        assert_eq!(b - a, FieldElement::new(10));
        assert_eq!(a * b, FieldElement::new(200));
    }
    
    #[test]
    fn test_circle_point_double() {
        // This would need a proper point on the circle
        // For now, just test the arithmetic
