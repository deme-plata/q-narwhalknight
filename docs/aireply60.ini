// crates/q-crypto-advanced/src/aegis.rs

use crate::errors::{CryptoError, Result};
use aegis::{
    aegis256::{Aegis256, CONST},
    Aegis, Error,
};
use getrandom::getrandom;
use zeroize::Zeroize;

#[derive(Clone, Debug, Zeroize)]
#[zeroize(drop)]
pub struct AegisKey([u8; 32]);

#[derive(Clone, Debug)]
pub struct AegisNonce([u8; 32]);

impl AegisKey {
    pub fn generate() -> Self {
        let mut key = [0u8; 32];
        getrandom(&mut key).expect("Failed to generate random key");
        Self(key)
    }
    
    pub fn from_slice(key: &[u8]) -> Result<Self> {
        if key.len() != 32 {
            return Err(CryptoError::InvalidParameters(
                "AEGIS-256 key must be 32 bytes".to_string()
            ));
        }
        let mut key_arr = [0u8; 32];
        key_arr.copy_from_slice(key);
        Ok(Self(key_arr))
    }
    
    pub fn as_bytes(&self) -> &[u8; 32] {
        &self.0
    }
}

impl AegisNonce {
    pub fn generate() -> Self {
        let mut nonce = [0u8; 32];
        getrandom(&mut nonce).expect("Failed to generate random nonce");
        Self(nonce)
    }
    
    pub fn from_slice(nonce: &[u8]) -> Result<Self> {
        if nonce.len() != 32 {
            return Err(CryptoError::InvalidParameters(
                "AEGIS-256 nonce must be 32 bytes".to_string()
            ));
        }
        let mut nonce_arr = [0u8; 32];
        nonce_arr.copy_from_slice(nonce);
        Ok(Self(nonce_arr))
    }
    
    pub fn as_bytes(&self) -> &[u8; 32] {
        &self.0
    }
}

pub struct Aegis256;

impl Aegis256 {
    /// Encrypt plaintext with associated data
    pub fn encrypt(
        key: &AegisKey,
        nonce: &AegisNonce,
        plaintext: &[u8],
        associated_data: &[u8],
    ) -> Result<Vec<u8>> {
        let cipher = Aegis256::new(key.as_bytes(), nonce.as_bytes());
        let mut ciphertext = vec![0u8; plaintext.len() + 16]; // +16 for tag
        
        cipher
            .encrypt(plaintext, associated_data, &mut ciphertext)
            .map_err(|e| CryptoError::EncryptionError)?;
            
        Ok(ciphertext)
    }
    
    /// Decrypt ciphertext with associated data
    pub fn decrypt(
        key: &AegisKey,
        nonce: &AegisNonce,
        ciphertext: &[u8],
        associated_data: &[u8],
    ) -> Result<Vec<u8>> {
        if ciphertext.len() < 16 {
            return Err(CryptoError::MalformedInput(
                "Ciphertext too short".to_string()
            ));
        }
        
        let cipher = Aegis256::new(key.as_bytes(), nonce.as_bytes());
        let mut plaintext = vec![0u8; ciphertext.len() - 16];
        
        cipher
            .decrypt(ciphertext, associated_data, &mut plaintext)
            .map_err(|_| CryptoError::EncryptionError)?;
            
        Ok(plaintext)
    }
    
    /// Encrypt in-place (more efficient for large data)
    pub fn encrypt_in_place(
        key: &AegisKey,
        nonce: &AegisNonce,
        buffer: &mut [u8],
        associated_data: &[u8],
    ) -> Result<Vec<u8>> {
        let cipher = Aegis256::new(key.as_bytes(), nonce.as_bytes());
        let mut tag = [0u8; 16];
        
        cipher
            .encrypt_in_place(buffer, associated_data, &mut tag)
            .map_err(|e| CryptoError::EncryptionError)?;
            
        let mut result = Vec::with_capacity(buffer.len() + 16);
        result.extend_from_slice(buffer);
        result.extend_from_slice(&tag);
        
        Ok(result)
    }
}

/// Streaming encryption for large data
pub struct AegisStreamEncryptor {
    cipher: Aegis256,
