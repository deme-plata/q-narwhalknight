## 3. Phase 2–3 plans: feasibility and crypto details

### 3.1 Lattice-Based Aggregate Signatures

You’re targeting a Dilithium/Falcon-style aggregate with ~4 KB aggregate size, which matches the ballpark of current research on lattice-based aggregation and “half aggregation” for NIST PQ sigs. ([Aarhus University][6])

**Comments:**

* The **API design** (same message vs different messages, incremental aggregation) is sensible and matches what protocols often want.
* I couldn’t find the exact “IACR 2025/1056” paper yet; there *are* several works on lattice-based SAS / aggregation (Boneh/Kim, Boudgoust et al., etc.). ([ResearchGate][7])

  * I’d suggest you keep the doc slightly looser here (“based on recent lattice aggregation frameworks, e.g. …”) until the exact scheme you plan to implement settles.

**Engineering risk:**

* Getting the **side-channel story right** (constant-time lattice operations, NTTs, rejection sampling) is non-trivial.
* You might want to **wrap an existing vetted implementation** (or at least share code with your Dilithium/Falcon implementations) rather than writing all lattice arithmetic from scratch in this crate.

### 3.2 Genus-2 Curve VDF

This is the most experimental piece in the entire plan.

* VDFs over class groups and elliptic curves are still under active research; moving to genus-2 Jacobians is another step into the deep end.
* Your outline (hyperelliptic curve, Jacobian arithmetic, Frobenius-based VDF, proof via a DLOG-style argument) is conceptually plausible, but highly non-trivial to implement securely.

**Recommendations:**

1. **Keep an RSA/class-group VDF as a fallback.**

   * For a production consensus protocol, you probably don’t want to *only* rely on a brand-new genus-2 VDF until it has survived a lot of cryptanalysis.

2. **Be conservative about claimed “quantum 128-bit” security.**

   * The concrete security of DLOG in genus-2 Jacobians under quantum attacks is not nearly as standardized as for lattices or symmetric crypto. I’d present this as **“experimental PQ-candidate VDF with target 128-bit security”**, not as firmly “128-bit quantum-secure”.

3. **Slot-time calibration**

   * `iterations_for_delay(target_ms)` is a good abstraction, but you need to be very clear about:

     * How you calibrate across *hardware variance*.
     * How you prevent adversaries from using custom hardware to evaluate the VDF much faster and bias leader election.

### 3.3 SQIsign

Here your spec matches reality very well:

* Secret key 16 B, public key 64 B, signature 204 B (or smaller for SQIsignHD variants). ([SciSpace][3])

**Important trade-offs you already note:**

* Keygen/sign/verify are **orders of magnitude slower** than lattice signatures.
* But you get **drastically smaller signatures and keys**, great for bandwidth-constrained environments and light clients.

**Things to emphasize / plan for:**

1. **Side-channel resistance**

   * Isogeny-based schemes are very sensitive to timing / micro-architectural leakage (especially in the isogeny walks).
   * Re-use as much as possible from the official SQIsign reference and follow-up implementations rather than rolling your own end-to-end. ([GitHub][8])

2. **Hybrid mode is the right call**

   * Your `HybridSignature { sqisign, dilithium: Option<_> }` is exactly what I’d recommend for a chain that can’t commit to isogenies alone yet.
   * Policy-wise, you might want:

     * A “strict hybrid” mode (both must verify).
     * A “transition” mode (only SQIsign required, Dilithium optional) for when you’re comfortable with SQIsign.

3. **Operational usage guidance**

   * SQIsign is a better fit for **high-fanout, bandwidth-sensitive signatures** (block headers, state commitments, light-client proofs) than for **high-frequency transaction signing** (wallets), given its cost profile.
   * It’d be useful to encode that in your docs to avoid people using it in latency-sensitive spots by accident.

### 3.4 Improved Bulletproofs

The doc references “Efficient Confidential Transactions” (2024/1756) as an update on Bulletproofs; the original Bulletproofs paper from 2018 already has aggregation and batching ideas. ([Stanford University][9])

**Main comment: quantum security classification**

* Bulletproofs rely on elliptic-curve discrete log; under Shor, that’s **fully broken**, not “~64-bit”.
* In your table, I’d change:

  * Quantum Security: “Broken under standard quantum assumptions; not PQ-secure.”
  * Status: ⚠️ “PQ-unsafe; acceptable only as a *short- to medium-term* confidential-transaction mechanism.”

The **API design** (aggregated range proofs, batch verification) is fine and mirrors common Bulletproofs implementations. Just keep a strong warning that this is **not** PQ-secure and will need a migration path.

