[package]
name = "q-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
# Core dependencies
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }

# Storage engines
bincode = { workspace = true }
lz4 = { workspace = true }

# Cryptography for hashing
blake3 = "1.5"
sha3 = { workspace = true }
hex = "0.4"
serde_json = "1.0"

# Q-NarwhalKnight types
q-types = { path = "../q-types" }
q-narwhal-core = { path = "../q-narwhal-core" }
q-dag-knight = { path = "../q-dag-knight" }
q-quantum-rng = { path = "../q-quantum-rng" }

# Networking for sync protocol
libp2p = { workspace = true, features = ["request-response", "cbor"] }

# Metrics
prometheus = { workspace = true }

# Platform-specific storage backends
# RocksDB has Windows cross-compilation issues with MinGW
[target.'cfg(not(target_os = "windows"))'.dependencies]
rocksdb = { workspace = true }

# Sled works on all platforms including Windows
[target.'cfg(target_os = "windows")'.dependencies]
sled = "0.34"

[dev-dependencies]
tempfile = "3.8"
tokio-test = "0.4"
proptest = { workspace = true }
# criterion temporarily disabled due to font-kit issues - benchmarks moved to separate crate