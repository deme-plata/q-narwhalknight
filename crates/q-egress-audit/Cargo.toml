[package]
name = "q-egress-audit"
version.workspace = true
edition = "2021"
description = "Pre-Tor / pre-WireGuard structured egress leak gate"
authors = ["Server Beta <server-beta@q-narwhalknight.dev>"]

# The gate sits in front of every outbound surface that could leak a clear-net
# IP, an onion address, or a bootstrap peer_id into a place an observer can
# read. When Q_TOR_REQUIRE_WIREGUARD=1 (see crates/q-network/src/
# unified_network_manager.rs ~line 1832) the gate runs in STRICT mode and
# blocks any payload it can't redact. In permissive mode it redacts when it
# can and warns when it can't.

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "1"
tracing = "0.1"
once_cell = "1"
regex = "1"

[dev-dependencies]
proptest = { workspace = true }
