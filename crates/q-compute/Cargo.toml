[package]
name = "q-compute"
version.workspace = true
edition = "2021"
description = "Starship Endgame Revolution — 100% compute utilization orchestrator"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
dashmap = "5"
crossbeam = "0.8"
core_affinity = "0.8"
sysinfo = "0.30"
num_cpus = "1"
parking_lot = "0.12"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_System_Threading", "Win32_System_SystemInformation"] }
