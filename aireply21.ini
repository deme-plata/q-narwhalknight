## 3️⃣ v1.0.15+ — what I’d prioritize next

Given v1.0.14 now hardens startup integrity, I’d line up the next couple of things like this:

### A. Chain hole detection (v1.0.15)

You’ve already marked this as P1. I’d actually treat it as **P0.5**:

* Pointer-vs-actual only tells you about the **top** of the chain.
* Holes in the middle are just as dangerous.

Implementation detail: don’t do a naive `for height in 0..=max_height` on a large chain; use:

* DB iterators and scan keys,
* verify monotonic + contiguous sequence,
* or maintain a simple “block_count” and sanity-check `block_count == highest_height + 1` on a single-tip chain.

If they ever diverge, treat as **Severe** and crash/require repair.

---

### B. Sync activation and “stuck at genesis” (v1.0.15)

From your previous RCA:

* Nodes can get stuck at height 1 waiting for peer announcements.
* Combined with pointer integrity, you’ll now always start from a safe height, but you still might never move.

High priority fixes:

1. **Timeout-based sync activation**
   If no progress after X seconds at low height → force an aggressive sync attempt.

2. **Active probing instead of passive announcements**
   Don’t just wait for gossipsub; periodically ask peers for height over RPC.

3. **Clean separation between “node healthy” and “chain progressing”**
   Expose a health metric like `chain_height_stagnant_seconds` to detect stuck nodes operationally.

---

### C. Tx pool & balance integrity (v1.0.16)

Your planned `FullIntegrityCheck { block_height, balance_height, tx_pool_height }` is exactly the right idea.

I’d enforce:

* `abs(block_height - balance_height) ≤ 1`
* `abs(block_height - tx_pool_height) ≤ 1`

and treat bigger gaps as at least a **warning**, and in production maybe a crash-fast with explicit guidance.

