## 2️⃣ Three practical things to double-check in 1.0.14

These are not redesigns, just “make sure they’re true in the actual code” checks.

### A. Startup ordering is really first

Make sure `check_and_repair_on_startup` happens:

* **Before** any component that:

  * reads `qblock:latest`, or
  * infers a height from it (sync, producer, balance engine).
* And that **no other tokio tasks** touching the DB are spawned before it finishes.

Given your snippet, that seems to be the case, but it’s worth quickly grepping to ensure no other early init path calls into storage with assumptions about `qblock:latest`.

---

### B. Thresholds behave sensibly on small chains

Your severity bands are good for big heights, but just sanity-check behaviour on tiny chains:

* If `actual_highest = 50`, `pointer = 0` → diff = 50 → Severe (auto-repair)
  👍 That’s what you want.
* If `actual_highest = 50`, `pointer = 40` → diff = 10 → Moderate → crash
  You may want **small-height special casing** later, but for now “crash instead of running weirdly” is still safe.

I’d just confirm via tests that the logic doesn’t accidentally treat early dev chains (heights < 100 or < 1000) in some bizarre way because of constants tuned for 12k+.

---

### C. Logging is unambiguous and operator-friendly

Your examples look great. I’d just verify in code that:

* Every path that sets `CorruptionSeverity::{Minor,Moderate,Severe}` logs:

  * pointer height,
