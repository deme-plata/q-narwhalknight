● Bottleneck Analysis - Why Sync is Taking Days Instead of 7 Minutes:

  Critical Issues Found:

  1. ONE-BY-ONE Block Responses (crates/q-api-server/src/main.rs:1413-1447)
    - Each block is sent as a SEPARATE gossipsub message
    - Each message triggers full network propagation overhead
    - This is the BIGGEST bottleneck
  2. 5-Second Wait Between Batches (line 2098)
    - After requesting 1000 blocks, waits 5 seconds before checking progress
    - This serializes sync instead of pipelining
  3. Sequential Height Checking (lines 1478-1488)
    - After each block, checks for consecutive blocks one-by-one
    - Should validate batches in parallel
  4. No Parallel Peer Requests
    - Only requests from one peer at a time
    - Should request different ranges from multiple peers simultaneously
  5. No Database Batch Writes
    - Each block written individually to RocksDB
    - Should batch commit 1000+ blocks at once

