[workspace.package]
version = "10.11.19"  # v10.11.19 (2026-05-22 MEM-LEAK FIX): state_sync_api.rs bootstrap_sync held wallet_balances.write() across N sync fsyncs (60+s lock-held), causing unbounded mpsc channels to back up → 38GB anon heap in 5min on v10.11.18 Epsilon. Same anti-pattern v8.9.4 fixed in main.rs but state_sync was missed. Fix: snapshot-pass (read lock) → persist with no lock → brief write-lock merge. Confirmed via /proc/PID/status: RssAnon 38GB, RssFile 10MB (pure heap, not RocksDB mmap). Logs ruled out (1 line/min). # v10.11.18 (2026-05-22 MONEY-PRINTER FIX): v10.11.17 removed the handler-level NATIVE-QUG RocksDB write expecting balance_consensus.process_block to debit the sender via subtract_balance. It does — calls save_wallet_balance internally which hits the max-wins guard (old > new for any debit) → SKIPPED → sender keeps full balance, recipient still credited. Net: amount MINTED per transfer. Smoking gun in journal at 13:55:52: "subtract_balance(): delta=-X" immediately followed by "save_wallet_balance(): SKIPPED (max-wins: old > new)". v10.11.17 traded double-credit for missing-debit, same severity. Root fix: subtract_balance now writes via save_wallet_balance_authoritative (lib.rs:9785), bypassing max-wins. # v10.11.17 (2026-05-22 DOUBLE-CREDIT FIX): v10.11.15 added save_wallet_balance_authoritative writes in dag_knight cert callback native-QUG branch, but balance_consensus.process_block ALSO credits/debits the same tx at block-apply → recipient double-credited (send 4 QUG → receiver +8). With v10.11.16 dual-hash auth_trusted fix, tx now reaches block_producer cleanly and balance_consensus runs end-to-end, so v10.11.15 persist is redundant AND wrong. v10.11.17 removes handler-level RocksDB writes; in-memory wallet_balances HashMap update stays for UX. Verified via journal trace of tx 2e9f5bb8 (4 QUG send → two credits: 11:22:48 v10.11.15 handler + 11:23:00 balance_consensus [TRANSFER]). # v10.11.16 (2026-05-22 ROOT-LAYER FIX): mark_auth_trusted called with tx.id (SHA3-256) but TxValidator looks up via transaction.hash() (postcard) at production_mempool.rs:873. Hashes differ (documented at block_producer.rs:966). Result: auth_trusted lookup MISSED → mempool rejected tx with "signature invalid" (signature is empty by design) → tx never entered production_mempool with Valid status → block_producer never packed it → ghost-confirmed via dag_knight callback only → v10.11.15 in-memory + RocksDB write worked but recovery on restart wiped it because tx was never in a block. v10.11.16 marks via BOTH tx.id AND tx.hash() so the lookup hits regardless of variant. Fixes handlers.rs:5703 (send_transaction_signed) and :5999 (send_transactions_batch). After this fix, send_signed txs should pass mempool validation → block_producer packs them → block-apply persists via balance_consensus (the proper path) → survives restart recovery. # v10.11.15 (2026-05-22 ROOT-CAUSE FIX) (2026-05-22 ROOT-CAUSE FIX): handlers.rs dag_knight cert callback native-QUG branch updated in-memory wallet_balances HashMap but NEVER persisted to RocksDB via save_wallet_balance_authoritative. After restart: changes lost. Without restart: signed /balance queries (read from RocksDB) returned stale pre-tx values. Tx_status reported "confirmed at block <current_round>" via the surrounding TxStatus::Confirmed mark but the tx never landed in any block (block_producer pack pipeline only saw coinbase). v10.11.13/.14 instrumentation showed mempool/producer/save never even reached — because dag_knight consumed the tx, marked it Confirmed, applied to memory, dropped without persist. THE bug. Two added persist calls fix it (save_wallet_balance_authoritative bypasses max-wins so debits aren't silently refused). # v10.11.14 (2026-05-22 SEND-PATH MNEMONIC DERIVATION FIX): handlers.rs:4849 (2026-05-22 SEND-PATH MNEMONIC DERIVATION FIX): handlers.rs:4849 send_transaction_inner Path A used BIP39-PBKDF2(mnemonic,"")[..32]; wallet UI (walletAuth.ts:228) AND server import_wallet (handlers.rs:2562) use SHA3-256(mnemonic). The schemes produce different private keys → server signed every wallet-UI HTTP send with a key whose pub key did not match tx.from → mempool rejected 100% with "Ed25519 signature verification failed". v10.11.14 switches Path A to SHA3-256(mnemonic) for parity. Relates to (but distinct from) v10.11.13 block-save instrumentation: signature-reject failures evicted txs BEFORE block-inclusion; v10.11.13 is for the next-stage class of bug where txs apparently land in blocks but contain only coinbase. # v10.11.13 (2026-05-22 BLOCK-SAVE INSTRUMENTATION): adds warn-level logs at three apply-pipeline waypoints to diagnose the "tx_status confirmed but /blocks/N has 0 non-coinbase" bug. Observed 2026-05-22 for Adrian (43887b18), Viktor (e68226d8, 2bc682b0), and self (879b8359) — all reported confirmed at blocks 18,257,696 / 18,257,945, but those blocks contain only coinbase txs when queried via /api/v1/blocks/N. Three log points added: (1) block_producer.rs PRODUCER-CONFIRM — count of user_tx_ids being marked Confirmed + count actually in block.transactions at the same point; (2) q-storage lib.rs SAVE-QBLOCK-DIRECT — transfers in the block at storage save time, direct path; (3) q-storage transaction.rs SAVE-QBLOCK-TX — transfers at save time, transaction-wrapped path. Together these answer: is producer marking Confirmed without packing, or is the save path stripping transfers? Also inherits v10.11.12 NonceTracker persistence (RocksDB CF manifest key "nonce_<addr-raw>" → u64 LE). # v10.11.12 (2026-05-22 NONCE-TRACKER PERSISTENCE): (2026-05-22 NONCE-TRACKER PERSISTENCE): NonceTracker was in-memory only — every restart wiped per-wallet nonces back to 0 while chain remembered higher values. First post-restart send_signed per wallet got nonce=0 (already used) → silently dropped between mempool admit and block-pack. Fix: persist via RocksDB CF "manifest" key "nonce_<addr-raw>" → u64 LE on every increment, lazy-load on first access. Reproduced 2026-05-22 on Epsilon: probe tx 665a0ba9 (nonce=0) dropped vs follow-up 43887b18 (nonce=1) settled at block 18,257,945. # v10.11.11 (2026-05-22 GHOST-CONFIRMATION FIX): handlers.rs send_transaction_signed + send_transactions_batch were setting tx.fee = MIN_TRANSACTION_FEE_V1 (2100, reduced-fee mode). But validate_fee()'s zero-arg path uses validate_fee_at_height(0) which is LEGACY mode where min_required_fee = BASE_GAS * MIN_FEE_PER_GAS = 21_000. V1's 2100 is 10x BELOW the legacy threshold → mempool stored these txs with ValidationStatus::Invalid → get_transactions_for_block filtered them out → never landed in a block. But /transactions/<hash> still reported them as "confirmed at block_height=N+confirmations=K" reading from the mempool record, so explorer/UI showed ghost confirmations while no balance ever moved. Fix: MIN_TRANSACTION_FEE_V1 → MIN_TRANSACTION_FEE (21_000) at handlers.rs:5613 and :5903. The constant satisfies both legacy AND reduced-fee min_required_fee (21000 / 10 = 2100 ≤ 21000). Diagnosed 2026-05-22 02:30 via a 550-QUG send that registered tx hash + fake block_height but never debited sender or credited recipient; also reproduced on the 1-QUG-memo handshake-test from earlier in the session. # v10.11.10 (2026-05-22 APPLY-GATE FOLLOW-UP): background contiguity tick now also calls upgrade_manager.set_height(new_height) when it advances the apply gate. Without this, data.upgrades.current_height (the API surface operators read in /api/v1/status) stays parked at the value upgrade_manager was last set to via block-production or sync paths. For a long-running node where storage advances via gossipsub but block-production has stalled, the visible symptom (status field) keeps lying about the apply gate height until a new locally-produced block lands. v10.11.10 closes that gap inside the same tokio::spawn that already calls tick_contiguity_advance every 5s. Verified live on q-sync-test-v10.11.5-epsilon redeploy 2026-05-22: data.upgrades.current_height moved 18,098,949 → 18,114,949 on first boot via the HUNK 3 boot-extension walk (height_cache.update + main.rs:9865 upgrade_manager.set_height); the background tick patch added in v10.11.10 ensures the SAME advance happens for long-running nodes that don't restart. # v10.11.9 (2026-05-22 APPLY-GATE WEDGE FIX): derived-query contiguous-tip + 5s background tick + boot-extension walk. Closes the wedge where data.upgrades.current_height parked at the checkpoint heal pointer (18,098,949) while qblock:tip_height climbed to 18,114,949 — 16k blocks stored above the apply gate but never folded into the contiguous chain. Root cause: contiguous tip was modeled as a write-side counter advanced inside save_qblocks_batch_turbo, gated on the in-batch first height matching cache+1. When TURBO SYNC DIRECT batches landed past the gate (decided by current_height_atomic = storage tip, not contiguous tip), the in-batch walk broke on iteration 1 and the v10.2.7 forward-probe was gated on the batch having advanced — so it never fired. Five prior patches (v7.2.8 swiss-cheese, v7.2.9 high-probe, v7.3.10 fast-recovery threshold, v8.3.0 verify-target, v10.2.7 forward-probe bridge) each fixed one symptom but kept the model. v10.11.9: contiguous tip is a DERIVED PROPERTY of storage — new advance_contiguous_tip(from_height) walks forward via is_height_present checks, bounded by qblock:tip_height + MAX_ADVANCE_PROBES=100K. tick_contiguity_advance wraps it with atomic persist of qblock:latest + qblock:contiguous_verified + height_cache.update. Called from: (1) end of save_qblocks_batch_turbo (replaces in-batch walk + v10.2.7 gate), (2) 5s background tick in main.rs (catches post-boot wedges + out-of-batch advances), (3) boot path after scan_highest_contiguous_block_internal (catches the v7.3.10 heuristic's under-estimate). Verified live against the 18,098,949 wedge on q-sync-test-v10.11.5-{epsilon,delta}: post-patch boot should advance the gate to 18,114,949 within 5s, sync engine resumes fetches at gate+1. # v10.11.3 (2026-05-21 MONEY-PRINTER FIX): save_wallet_balance_authoritative() bypasses max-wins guard for DEX swap settlement + balance finality. Max-wins was silently dropping legitimate debits (new < old amount), so user QUG never decreased on swap = repeatable money glitch. Adds new fn on q-storage StorageEngine + flips 3 consensus-path callers (liquidity_api 2x, balance_finality_engine 1x). Gossip/state-sync remain on max-wins-protected save_wallet_balance per CLAUDE.md Rule 1. v10.11.0: Tier 3 send_batch endpoint — POST /api/v1/transactions/send_batch accepts up to 100K transfers in one HTTP request from the X-Wallet-Auth'd sender. Server reads balance ONCE, reserves N monotonic nonces up front, runs running-total balance check per entry, supports astronomical u128 amounts up to the 1e33 raw per-entry cap, allows mixed token types per batch. Tested against v10.10.13 production baseline (301 tx/s at N=1000 via tps-bench v0.2 from Beta over real network); v10.11.0 batch path should multiply that 5-50x depending on batch size by collapsing N HTTPS roundtrips + N Ed25519 auth verifies into O(1). Next: NASA-style robustness layer (idempotency keys, pre-flight pass, watchdog timeouts, sequence-loss detection) and Tier 1.4 session tokens + Tier 2 q-flux read cache. v10.10.13: DIAL REGRESSION FIX + EXTREME BLOCK-PACK PERMITS + balance_smt compile fix. The v10.10.11/.12 100% DialFailure (unified_network_manager.rs:~6669 PEER CHECK path returned Some(pid) without calling swarm.dial — libp2p request-response does NOT auto-dial cached addrs; every block-pack chunk failed even with gossipsub mesh up; proven on q-test-v10.10.11-eps + q-test-v10.10.11-delta probes 2026-05-21 — both stuck at ~125K/110K respectively after 1h with 1,440 DialFailure/5min, 10/10 chunks failing). Fix: actually call self.swarm.dial(addr) for each cached multiaddr before returning Some(pid). PLUS extreme permit tune: BLOCK_PACK_BASE_PERMITS 16→32, BLOCK_PACK_EXTRA_PERMITS 12→32 (total 64 at tip on Epsilon's 48 cores; ~960 MB worst-case in-flight, safe vs 50 GB cgroup cap). PLUS balance_smt.rs:351 1-line type fix from v10.9.55 cherry-pick (delete_range_cf args needed matching &[u8] slices instead of &[u8;1] + &[u8;64]). # v10.10.12: SPARSE-CHAIN AWARENESS + DEV-FEE 5% + AEGIS-QL GATE. Cherry-picked 4 commits from release/v10.9.55 (ee36a1a3 main sparse-chain awareness, b1cc7e29 Codex review fixups, 598dd294 PASS-2 synced_through cap fix, 82d264fa REMOVE safe_batched_convergence_v103 unsafe balance migration) on top of v10.10.11's sync-spam fixes. The agent/cross-shard-simd-validation branch was missing 595 LOC of v10.9.43-55 sparse-chain code, causing fresh-node sync to wedge at the first sparse gap (proven on 2026-05-21 smoke test: Epsilon container synced 0→125,801 then stalled because Q_KNOWN_PERMANENT_GAPS handler + synced_through pointer + autonomous gap-heal were absent). Brings: synced_through monotonic pointer (resume past sparse gaps), KnownGaps + Q_KNOWN_PERMANENT_GAPS env var (default 25988:100440), spawn_gap_advance_handler autonomous heal, thompson_pick_peer Beta-sampling, kalman_bdp adaptive chunk size, Q_GAP_TRUST_SINGLE_PEER/THRESHOLD policy, Q_GENESIS_SYNC_ONLY cap, Q_SKIP_CHECKPOINT bypass. Existing v10.10.11+ work (Fix A/B/C/D sync-spam, AEGIS-QL gate on /admin/dev-fee/config, dev_fee 190→500, mining_calculator MCP, DEFI5 real basket) all preserved through auto-merge. v10.10.11: SYNC-ERROR SPAM FIX. Plan in /root/.claude/plans/robust-shimmying-hearth.md. Two changes: (1) raise default dev_fee_bps from 190 (1.9%) to 500 (5%) at lib.rs:2881 + lib.rs:4275 — fresh nodes start at 5%; existing running nodes carry their runtime atomic across restart. (2) POST /api/v1/admin/dev-fee/config is now gated by AEGIS-QL post-quantum founder-signature middleware (main.rs:25539 wrap, applies same verify_founder_signature as bank's create_protected_routes). The handler at deploy_admin_api.rs:1437 dropped the spoofable is_master_wallet string-match check (which only compared the public founder address from X-Wallet-Auth, allowing trivial forgery) — middleware now enforces. Audit log added with target=audit.dev_fee + actor + old_bps + new_bps for journalctl filtering. AEGIS-QL infrastructure already wired into AppState.aegis_auth_state since v?; this batch just applies the existing middleware to a new route. v10.10.11: SYNC-ERROR SPAM FIX. Plan in /root/.claude/plans/robust-shimmying-hearth.md. Diagnosed via host-side tshark on docker0 (155:1 inbound:outbound ratio = receiver-task died on v10.10.10-fresh). Five changes: (A) crates/q-network/src/unified_network_manager.rs:4085 gossipsub forward warn rate-limited per-topic 10s + per-drop Prometheus counter increment regardless of suppression. (B) crates/q-api-server/src/main.rs:10024 supervisor wraps the receiver task — Arc<Mutex<Receiver>> survives panic, inner spawn respawns with 500ms backoff, qnk_gossipsub_consumer_restarts counter increments per restart. (C) NEW crates/q-types/src/rate_limited_log.rs — generic RateLimitedLog + rl_warn!/rl_error! macros placed in q-types to avoid q-network↔q-storage cycle. Zero new deps (std RwLock + AtomicU64). 4 unit tests. (D) crates/q-network/src/metrics.rs adds 4 new Prometheus families (qnk_gossipsub_forward_failed{topic,reason}, qnk_gossipsub_messages_forwarded{topic}, qnk_gossipsub_consumer_restarts, qnk_sync_no_peers_total). (E) crates/q-storage/src/turbo_sync.rs — 7 spam sites wrapped (CHECKPOINT PROBE 3604 per-1000-height-bucket 10s; NO PEERS AVAILABLE 4522 banner global 30s; P2P DIRECT ERROR Request 6303 per-peer 10s; P2P DIRECT ERROR Response-closed 6333 per-peer 10s; P2P DIRECT Chunk-timeout 6367 per-peer 10s; Failed chunk after retries 6701 per-chunk-range 60s; TURBO SYNC DOWNLOAD FAILED 6840 banner global 60s). Frontend also: LoginScreen.tsx AI Setup modal expanded to max-w-3xl with 8-cell capability matrix + 6-step animated agentic-loop visualization (Quillon Agentic AI / v2.2.0 — 44 tools). Plan in docs/x-algorithm-deeper-dive-2026-05-20.md. Eight changes against agent_panel/: (1) pipeline.rs grows 6 stages → 10 — added QueryHydrator + DependentQueryHydrator + PostSelectionHydrator + PostSelectionFilter, matching xAI Home Mixer's actual 10-phase layout. Per-stage `enable(&self, ctx) -> bool` + `name(&self) -> &str` default methods on Hydrator/Filter/Scorer so existing impls compile unchanged. Pipeline.run() emits a tracing::info! span per stage for observability. (2) concrete.rs filled ConfirmedTxSource (scans tx_pool, 30s age heuristic) and DexSwapSource (reads state.swap_history HashMap, fields match handlers.rs:11036 SwapHistoryRecord shape). (3) WalletGraphJaccardHydrator reads pre-fetched counterparty sets from new query_data side-channel; folds wallet_graph_jaccard component into ScoreReport with weight 0.10 — chain analogue of Twitter's mutual_follow_jaccard, cleanest graph signal we have without TR-2026-004's adversarial-tx-graph problem. (4) New scorers: WalletReputationScorer (log-saturating 1.0 - exp(-count/30)), FeeReasonablenessScorer (median-distance 1/(1+|ln(ratio)|)), PoolDepthScorer (stub returning 0.5, needs reserves snapshot), NegativeFeedbackScorer (returns -1.0 if origin_wallet appears in wallet_blocks query_data). (5) DiversityTopK replaces naive TopK — greedy with diminishing returns per (task_type, first-8-hex-of-id) bucket, lambda=0.6, prevents 50-mempool-tx-to-same-recipient outcomes. (6) New module seen_tracker.rs (~200 LOC, 5 tests) implements PreviouslySeenFilter via Arc<SeenTracker> with HashMap<wallet, HashSet<task_id>> + FIFO VecDeque eviction at 5000-per-wallet cap; mirrors xAI home-mixer/filters/previously_seen_posts_filter.rs — agent polling every 5s no longer gets the same task forever. Process-global accessor via OnceLock keeps API surface tiny. (7) New module score_history.rs (~280 LOC, 3 tests) — Arc<ScoreHistory> with bounded VecDeque<ScoreEntry> per wallet (1000 cap), summary() returns calibration-friendly mean/component-mean stats. The "killer next move" foundation from x-algo deeper-dive §2.6 + §A.3, in-memory first form (v10.10.11 will add RocksDB CF_SCORE_HISTORY). New REST route GET /api/v1/agent/score-history/:addr (owner-auth required) returns raw entries newest-first; ?view=summary returns the aggregate calibration view. (8) PanelContext gained a query_data: Arc<RwLock<HashMap<&'static str, serde_json::Value>>> side-channel for QueryHydrators to publish to DependentQueryHydrators; new PanelContext::new() constructor — single existing call site (handler.rs) migrated. handler.rs records every panel computation into ScoreHistory + marks selected task_ids in SeenTracker so the next pipeline run for the same wallet doesn't resurface them. What I deliberately deferred to v10.10.11: real RocksDB CF_SCORE_HISTORY persistence (schema migration), Phoenix sidecar Layer 2 ML (weights not yet in candle format), per-stage length-guards + CacheStore (instrumentation done but not gating), adversarial red-team review (separate session per plan §3.c). Tor task #62 (Phase C outbound transport wrap, ~150 LOC adapter using QTorClient.connect_to_peer) still pending — not in this batch. LOC added: pipeline.rs +180, concrete.rs +650, seen_tracker.rs +200, score_history.rs +280, handler.rs +120, main.rs +5, ~1435 LOC of agent-panel scoring infra. Tasks closed by this release: #74 (Sources real), #76 (Hydrators — 4 added, 3 stubs + WalletGraphJaccard + ApprovalUrl real), #77 (3 scorers), #78 (DiversityTopK), #79 (negative-feedback wired), #83 (4 missing stages), #85 (previously_seen filter live), #86 (wallet-graph Jaccard hydrator). Partial: #73 (in-memory done, RocksDB pending), #84 (enable+stats done, length-guards + cache deferred), #75 (still tracing-only). # v10.10.9: TOR PHASE A (now actually works) + PHASE B Dandelion stem. Two real changes since v10.10.8: (1) main.rs:2914 swapped QTorClient::new() → QTorClient::new_with_embedded_arti() — the plain new() defaulted to SOCKS5 external-proxy mode at 127.0.0.1:9050, which timed out 24×5s=120s on every smoke because docker containers have no external Tor daemon, then tor_client=None and Phase A's WARN fallback fired. The embedded-Arti variant runs Tor in-process via the bundled arti-client crate. lib.rs:429. (2) Phase B hook at unified_network_manager.rs:6463 (SHARKGOD direct TX publish path): when tor_policy.stem_via_tor && tor_client.is_some(), call tor.broadcast_message(&data, &topic).await — routes through QTorClient's DandelionProtocol (stem) instead of clearnet gossipsub. Falls back to gossipsub on any error (graceful degradation). PHASE C (outbound transport wrap) STILL DEFERRED to v10.10.10 — the existing TorTransport::new takes Arc<DedicatedCircuitManager>, a different type from QTorClient.circuit_manager: Arc<Mutex<CircuitManager>>, so wiring it cleanly needs either a new builder method on QTorClient OR a from-scratch adapter using QTorClient.connect_to_peer (~150 LOC either way). Inbound onion delivery (Phase A++) also remains — OnionService has no accept()/incoming() method, TorListener.incoming_rx is None, TorTransport::poll returns Poll::Pending forever; making that work end-to-end is ~300 LOC of Arti launch_onion_service integration. # v10.10.8: TOR PHASE A (announce-only) + 2 infrastructure fixes. Per-plan scope was A+B+C but honest scope-reset midway: Phase A ships, Phases B/C deferred to v10.10.9 because the existing TorEnabledTransport::dial at q-network/src/tor_transport.rs:355-358 is a stub-delegates-to-base (Phase C would need a real libp2p Transport impl wrapping Arti DataStream, ~250-400 LOC) and Dandelion stem publish hooks live in q-tor-client::dandelion.rs not in unified_network_manager.rs:1989 (Phase B needs DandelionProtocol publish-hook exposure, ~150-200 LOC). What DID ship: (1) NetworkTorConfig extended with 4 lifecycle flags listen_onion/stem_via_tor/outbound_via_tor/skip_sync_via_tor (default OFF), from_env() reads Q_TOR_LISTEN_ONION/STEM/OUTBOUND/SKIP_SYNC. (2) UnifiedNetworkManager::new() now takes Option<Arc<QTorClient>> + holds tor_client + tor_policy fields. (3) Phase A: when Q_TOR_LISTEN_ONION=1, call QTorClient::start_onion_service, build /onion3/<base32>:<port> multiaddr, swarm.add_external_address — Identify announces our hidden service to every peer. swarm.listen_on for onion3 deferred to Phase C (transport stack doesn't recognize /onion3/ multiaddrs yet). (4) Task #64 fix: main.rs:2914 Tor bootstrap now synchronous with Q_TOR_BOOTSTRAP_TIMEOUT (default 60s) — pre-fix it was tokio::spawn-and-drop so the Arc never escaped. Skip-fast for nodes without any Q_TOR_* flag set (no startup cost for clearnet-only operators). (5) Task #58 fix: io_uring_adapter.rs check_uring_available now reads /proc/self/status Seccomp: field, returns false in mode=2 (Docker default) before tokio_uring::start can panic-abort the process. Also honors Q_DISABLE_IO_URING=1 override. Docker containers no longer need --security-opt seccomp=unconfined to boot. # v10.10.7: 4-TASK COMPLETION BATCH — (1) Agent panel handler X-Wallet-Auth gate on mode=owner (401 if no auth, 403 on mismatch, 200 otherwise) at agent_panel/handler.rs. (2) AFL-1 mempool wiring: agent_api.rs rewritten from 501 stubs to real submit pipeline via AuthenticatedWallet extractor + nonce_tracker.get_and_increment + TransactionBuilder + transaction_utils::submit_transaction; submit_batch now returns per-tx items[] for partial failures. (3) NEW crates/q-api-server/src/qshare_api.rs (~370 LOC) with GET /qshare/state, GET /qshare/premium, POST /qshare/try_mint_signed, POST /qshare/try_buyback_signed, POST /qshare/bootstrap_pool; added qshare_contract field to AppState (default-initialized at both v0+v1 construction sites). (4) AMM pool seed: bootstrap_pool genesis endpoint for QSHARE/QUG initial liquidity. Closes the 4 items from "also do tehse now". Followups (v10.10.8): QSHARE CF_CONTRACTS persistence, AEGIS-QL founder gate on bootstrap_pool, real TWAP. # v10.10.6: AGENT PANEL SCORING PIPELINE GOES LIVE. NEW: crates/q-api-server/src/agent_panel/concrete.rs (~410 LOC, 5 tests) with TaskCandidate + concrete impls of all 6 pipeline traits (MempoolTxSource, ConfirmedTxSource, DexSwapSource, AgeFilter, EmbedVisibilityFilter, RecencyScorer, TrustTierScorer, StatusPriorityScorer, SseEventEmitter, AccessLogger) + build_default_panel_pipeline() factory. NEW: crates/q-api-server/src/agent_panel/handler.rs (~210 LOC, 4 tests) implementing GET /api/v1/agent/panel/:addr per docs/agent-activity-panel-spec.md §2 — returns NOW/QUEUED/DONE zoned + scored task list. xAI Home Mixer architecture applied to chain events. Bundles all v10.10.5 work (AFL-1 scaffold + QSHARE-1 L3 + match-arm patches). # v10.10.5: AFL-1 SCAFFOLD + QSHARE-1 L3 + handlers.rs match-arm patches. NEW: crates/q-api-server/src/agent_api.rs (~280 LOC, 3 tests) with submit_single + submit_batch handlers + body-hash verification + batch-size enforcement (default 1000, Q_AGENT_BATCH_MAX cap 10000). Routes registered at /api/v1/agent/submit + /api/v1/agent/submit-batch — currently 501 NOT_IMPLEMENTED until signature verify + nonce alloc + mempool insert + gossipsub broadcast lands. Bundles all v10.10.4 work (QSHARE L3 contract, TokenType::QSHARE) + 6 handlers.rs match-arm fixes + CreditTier Hash derive + unified_network_manager.rs gossip-log match arm. # v10.10.4: QSHARE-1 L3 IMPLEMENTATION — autonomous treasury share token (Saylor-style premium-arbitrage smart contract on-chain). NEW: crates/q-vm/src/contracts/qshare_token.rs (570 LOC, 6 tests) implementing try_autonomous_mint + try_buyback per spec §3-4. TokenType::QSHARE variant in q-types with reserved 'QSHARE' address bytes + QSHARE_DECIMALS=24. Trading-bot Phase 2 strategy crates/q-trading-bot/src/strategies/qshare_premium_arbitrage.rs (340 LOC, 6 tests) with decide_cycle() pure decision fn. 4 MCP tools (qshare_nav, qshare_premium_ratio, qshare_mint, qshare_buyback) in quillon-wallet-mcp. NOT YET WIRED: qshare_api.rs REST handlers + match arms for TokenType::QSHARE across 50+ files + AMM pool seed. Total this release: ~1400 LOC source. # v10.10.3: HOTFIX — PR #104 (email-tx persist) introduced wrong TokenType case (Qug vs QUG, Qugusd vs QUGUSD) + missing 5 Transaction fields (bulletproof, memo, nullifier, zk_proof_bundle, privacy_level). v10.9.59 build failed with 7 errors on email_api.rs. Cherry-picked ae026c002 from PR #94's v10.10.1 wire-up follow-ups — the targeted fix for these exact errors. Skipped 3f5abd41b (other v10.10.1 fix) because it refactors dex scorer to use agent_panel::scorers::ScoreReport when our PR #102 cherry-pick used an inline SwapScorer with Option<f64> — both compile; took the simpler. # v10.10.2: DOCS SWEEP — landed 3 standalone docs PRs: #78 (libp2p mesh-join investigation, 388 LOC), #79 (ZK / recursive-proof phase roadmap + CF_MANIFEST storage scheme, 236 LOC), #83 (wallet for Codex open task, 100 LOC). All clean cherry-picks. 28 of 29 Codex PRs now integrated into the buildable local-git lineage (97%). # v10.10.1: B4 BATCH — Twitter MCP + Activity Panel + QSHARE + partial WebGPU. PR #88 head (Twitter MCP + xAI x-algorithm spec docs). PR #95 2 commits (x-algorithm-scorer Rust sidecar Layer 1 + TS server Layers 2-3). PR #90 2 commits (Agent Activity Panel spec + trust-tier indicator). PR #96 3 commits (QSHARE-1 protocol spec + Phase 1 QCREDIT-DCA + live-mode + CLI subcommand). PR #94 2 of 6 (WebGPU miner PoC SHA3-256 with CPU fallback + TopBar WebGPU/Terminal buttons + AgentTerminalModal). Deferred from PR #94: 6a5b70d2d session unblockers, 9a4656870 MCP v1.3.0 agent-mode signing, 4c0b6c12e v10.10.2 out-of-box defaults, 3 v10.10.1 wire-up follow-ups — all need manual conflict resolution on main.rs lattice-tip producer-hook (135 LOC conflict, requires fresh session). 10 total commits in B4 batch, all signed Good. # v10.10.0: AFL-1 FOUNDATION — landed PR #87 selective + PR #91. PR #87 commits (chronological): d8eb2465 papers (3 Quillon-Graph analogical), f89a4e0f docs/p2p-chunk-stability-investigation.md (Codex brief), a5d4ffbb fix surface 23 hidden research papers + Vision UI category, 1c8d91d8 AFL-1 spec + AGENT.md + send_with_memo worked example, 62493d2a OpenAPI 3.1 spec docs/openapi.yaml, 1fe23e4b canonical signable_payload (THIS is the fix TR-005 claimed was live but wasn't — finally on our line). PR #91 head 06cc1932 BIP-style AFL-1 protocol spec docs/standards/afl-1-protocol-spec.md. 7 commits total, all signed Good. Effectively also covers PR #84/#85/#86 (their content shipped as part of PR #87 commits). v10.10.x branding revived per approved plan. # v10.9.61: GROUP 6 — landed PR #69 (crown-ash tutorial overlay, isolated to crown-ash-client side-game crate, +331/-6 LOC). PR #44 deferred to docs sweep (it edits docs files not yet on our line). # v10.9.60: RESCUE + SCORER CHAIN — landed PR #93 rescue commit (11 files recovered from Beta's untracked working tree: RecentActivityPanel.tsx 32KB, trading-bot wallet_auth/observer, slint-wallet config, integration tests, agent_panel/mod.rs + pipeline.rs, scorer foundation). Then scorer chain PRs #100 (wire agent_panel + scorers/mod.rs foundation), #101 (tx-response scorer +62 LOC), #102 (swap-response scorer +109/-29 LOC), #103 (ScoreBreakdown.tsx UI component +131 LOC). 5 commits total, all signed Good, original Codex/Viktor authorship preserved. Resolved one conflict on agent_panel/mod.rs by keeping the rescue's docstring + activating PR #100's scorers submodule. # v10.9.59: CODEX PR RECOVERY BATCH — cherry-picked 6 PRs onto agent/cross-shard-simd-validation: #89 (q-flux record circuit-breaker failures on HTTP upstream errors), #92 (X-Wallet-Auth body_hash for AFL-1 canonical signing), #98 (self-healing peer registry + /api/v1/p2p/known-peers endpoint, 2 commits), #104 (email-attached crypto-transfers persist as Transaction records for activity panel visibility), #105 (q-miner per-hash overhead reduction + SIMD-batch decentralized standalone hashing loop, 2 commits), #106 (SSE auth-via-query for browser EventSource wallet-filtered streams). 8 commits total, all signed Good, original Codex/Viktor authorship preserved. # v10.9.58: SECURITY CHERRY-PICKS onto agent/cross-shard-simd-validation lineage — PR #66 (max-wins guard on save_wallet_balance, CLAUDE.md Rule 1), PR #67 (AEGIS local-admin fails-closed when ConnectInfo missing), PR #68 (ProductionMempool perform_validation replaces Ok(true) stub with real signature/fee/coinbase checks). Three PRs merged to origin/main 2026-05-17 but never landed on release/v10.9.55 or release/v10.9.57; this release brings them into the buildable lineage. See TR-2026-009 for context on the release-branch-source mismatch. # v10.9.54: DELTA BOOTSTRAP PEER ID REFRESH — replaced hardcoded Delta peer `12D3KooWLJJRvqo6mBoHLpgxVbGKfW3Jv39ziU4kz1adKFv93JbK` (lost when zombie process generated a fresh identity during May 13–17 outage) with the live Delta v10.9.52 peer ID `12D3KooWPg1GsUhYtZdzN37NcLQCz2PXJ3GssKMtELwvMvHFrjTt`. 5 files (q-network/unified_network_manager.rs, q-api-server/main.rs ×2, q-miner/p2p_network.rs, q-types/lib.rs, CLAUDE.md). Required so other nodes auto-dial Delta on boot. Bundles v10.9.53 NODE TUI OVERHAUL — (a) removed Top Movers card + backing ring-buffer (private chain, low signal); saved ~290KB and per-tick RocksDB scan. (b) Added TRUSTLESS BOOTSTRAP PROOF card showing live tip-proof telemetry (scheme, anchor→tip, step_count, wire size, last verify µs against 10ms target) with cycling quantum glyph. (c) Added MINE TO THIS NODE info card showing endpoint URL, reward/block, recent credits/hr, q-miner wget+run hints. (d) Fixed render_recent_logs: log messages now sanitized (strip ANSI CSI, control chars, newlines; truncate to terminal width with ellipsis) — kills the after-uptime layout warping at bottom of dashboard. 4 files, net -75 LOC. # v10.9.52: CRITICAL DEX FIX — add_liquidity::pool_lookup no longer gates on `pool.provider == provider`. Previous code returned None when a non-creator wallet attempted to add to an existing pool, falling through to `pools.insert(new_pool_id, pool)` which SILENTLY OVERWROTE the entire pool with the new caller's amounts as the initial reserves. Discovered 2026-05-17 when agent wallet's MOON LP add destroyed FOUNDER's 97 QUG + 245M MOON in pool-90fec676…. Fix: any wallet may LP into an existing pool; per-LP shares already tracked via generate_lp_token_address(pool_id) credits in token_balances. One file, ~13 LOC. # v10.9.51: TIP-PROOF HARDENING + PERSISTENCE. (1) Closes DeepSeek §8 — LatticeTipProof gains step_count field, folded into commit() and verified equal to tip-anchor; prevents transcript-length forgery. proof_version bumped 'tip-blake3-fs-v1' → 'tip-blake3-fs-v1.1'; wire format 176 → 184 bytes. (2) Producer-hook now persists proof to CF_MANIFEST every 1000 extends + resumes on boot — kills the 18s cold-start warmup walk through 18M blocks. 4 files, ~227 LOC. Sprint crispy-marinating-hummingbird, closes GitHub issues #73 and #74. All v10.9.50 fixes carry forward (MAX_FORWARD_SKIP 1K, three zero-config defaults). # v10.9.50: ZERO-CONFIG SYNC. Three opinionated defaults flip ON for ./q-api-server stand-alone invocation: Q_GAP_TRUST_SINGLE_PEER=1 (autonomous heal accepts single-peer declarations), Q_GENESIS_SYNC_ONLY=1 (10K lookahead window cap), Q_SKIP_CHECKPOINT=1 (bypass checkpoint trust). Operator can disable any with =0. Triggered by v10.9.49 user report: fresh sync wedged at h=26K because Q_GAP_TRUST_SINGLE_PEER was missing from their env-var invocation (backslash line-continuation ate it). Now users don't need to set anything. ALSO lowers MAX_FORWARD_SKIP 10K → 1K in unified_network_manager.rs so SMALL gaps (~600 blocks) trigger permanent_gap declaration — fixes v10.9.49 canary stall at h=1,390,043 where Beta's forward-seek skipped only 657 blocks (under old 10K threshold). All v10.9.49 features (autonomous gap heal, BIP39 server validation, send_transaction_signed, airdrop AuthenticatedWallet gate, 8 Prometheus science gauges) carry forward unchanged. # v10.9.49: AGENTIC MONEY SECURITY — (A) NEW POST /api/v1/transactions/send_signed accepting X-Wallet-Auth only (no mnemonic, no vault); mirrors /dex/swap pattern so client-managed wallets (raw 32-byte seeds, not BIP39) can natively send QUG/QUGUSD/custom-token transfers from MCP. Existing /transactions/send untouched. (B) /api/v1/contracts/airdrop NOW REQUIRES AuthenticatedWallet + verifies caller == contract.deployer + 1000-recipient/call cap. CRITICAL SECURITY FIX: pre-v10.9.49 anyone could call airdrop on any deployed contract with zero auth — found 2026-05-17 while building agentic-money primitives. Carries v10.9.48: AUTONOMOUS GAP HEAL — kills the operator-facing Q_KNOWN_PERMANENT_GAPS env var by making detection fully autonomous. Builds on v10.9.46's correct condition fix at turbo_sync.rs:6904 (verified live on canary 15:09 UTC: contiguous 26000 → 100440, skipped 74453 blocks, counter qnk_known_gap_advances_total=1). Pieces: (1) NetworkManager.gap_advance_tx now a pure relay carrying (start, end, PeerId) — quorum/policy moved to TurboSync; new set_gap_advance_tx() setter. (2) TurboSync gains spawn_gap_advance_handler() task that applies multi-signal accept policy: `unique_reporters >= 2 OR (>= 1 AND beta_score >= Q_GAP_TRUST_THRESHOLD default 0.8) OR Q_GAP_TRUST_SINGLE_PEER=1`. (3) Accepted gaps persisted to RocksDB CF_MANIFEST via new QStorage::persist_permanent_gap()/load_permanent_gaps() — survive restart so next boot bypasses immediately without re-detection. (4) KnownGaps gains interior-mutable add_gap() using parking_lot::RwLock<Vec> so the handler can mutate at runtime without changing hot-path API. DEFAULT_GAPS now empty (was "25988:100440") — operators don't need to set anything. (5) main.rs wires libp2p_discovery (Arc<Mutex<NetworkManager>>) + turbo_sync via broadcast channel size=64; calls load_persisted_gaps() at startup. Env var Q_KNOWN_PERMANENT_GAPS still respected as operator override but never surfaced in user-facing docs. # v10.9.47: TWO SECURITY/AGENTIC FIXES — (A) NEW endpoint POST /api/v1/transactions/send_signed accepting X-Wallet-Auth only (no mnemonic, no vault) — mirrors the /dex/swap pattern so client-managed wallets (32-byte seeds, not BIP39) can send QUG/QUGUSD/custom-token transfers natively from MCP. Existing /transactions/send untouched (backward-compat). (B) /api/v1/contracts/airdrop NOW REQUIRES AuthenticatedWallet + verifies caller == contract.deployer + caps recipients per call at 1000. CRITICAL FIX: pre-v10.9.47 anyone could call airdrop on any deployed contract with zero auth (security gap discovered 2026-05-17 while building agentic-money primitives — used unauth path to deliver CLAI Token #1 to user, then immediately patched). v10.9.46: TWO consolidated fixes after careful diagnosis (no edit-compile-iterate cycle this round). (1) KNOWN-GAP OFF-BY-ONE FIX: turbo_sync.rs:6904 condition was `gap_start == working_height + 1` which silently failed every call on the canary (contiguous=26000 vs gap (25988, 100440) → 25988 == 26001 → false → no advance). Loosened to `next_block ∈ [gap_start, gap_end]` so the auto-advance fires whenever the next missing block falls anywhere inside the known gap range. Verified via 22 min of canary logs at 12:14–12:38 UTC showing `[CONFIG] Q_KNOWN_PERMANENT_GAPS = '25988:100440' parsed` once, then ZERO `[KNOWN-GAP] Auto-advanced` follow-up lines despite repeated `sync_to_height target=18112xxx contiguous=26000` invocations. (2) BIP39 BRAINWALLET HARDENING: import_wallet handler (handlers.rs:2287) now validates the supplied mnemonic against the BIP39 English wordlist+checksum BEFORE the legacy SHA3-256 derivation. Triggered by Discord report 2026-05-17 from a community member who landed in someone else's wallet after typing "a random number" — root cause was naive SHA3 hashing of any 12-word string with no wordlist or checksum check (validateSeedPhrase counted words and 3-8 char length only). Web wallet (LoginScreen.tsx + walletAuth.ts) also fixed to validateMnemonic via @scure/bip39 in same release — separate npm build. Slint native always validated (uses bip39::Mnemonic::parse_in). ALSO ADDED 5 Prometheus science gauges + 3 KNOWN-GAP gauges via q-storage::metrics::SyncOptimizerGauges (qnk_known_gap_configured_count/advances_total/blocks_skipped_total, qnk_kalman_bandwidth_mbps/latency_ms/loss_percent/optimal_chunk_kb/confidence), with new `encode_default_registry()` helper that NetworkMetrics::encode_text() can call to append the legacy prometheus crate's gauges to /metrics output (currently registered but unreachable). Wiring of Kalman writers deferred — gauges present so future writes appear in dashboards. v10.9.45 carry-forward: tokio-console layer composed into existing tracing registry (single global dispatcher), Q_KNOWN_PERMANENT_GAPS env var parsing, SIMD items 9/10/11/12/14, gossipsub config 1MB. # v10.9.45: HOTFIX v10.9.44 tokio-console init panic. v10.9.44 called `console_subscriber::init()` which installs its own GLOBAL tracing dispatcher, then the existing `tracing_subscriber::registry().init()` panicked with "a global default trace dispatcher has already been set". Fixed by building the console layer via `ConsoleLayer::builder().with_default_env().spawn()` and COMPOSING it into the existing registry alongside env_filter + fmt/tui layers — single global dispatcher, both functionalities preserved. Carries all v10.9.44 changes (Q_KNOWN_PERMANENT_GAPS deterministic skip, Kalman BDP chunk-size, CUBIC AIMD per-peer inflight, EWMV per-peer timeout, Beta Thompson peer pick helpers, 4 Prometheus gauges, SIMD items 9-12+14). # v10.9.44: WIRE in math optimizers + DEFINITIVE gap-skip. (a) Q_KNOWN_PERMANENT_GAPS env var — comma-separated `start:end` ranges; turbo_sync checks contiguous_height on every tick and advances past any gap whose start matches. The 26K wall is a KNOWN data-loss range (25988..=100440); this lets clients skip it without needing the server-side gap-decl trigger to ever fire. Default: `Q_KNOWN_PERMANENT_GAPS=25988:100440`. (b) Kalman BDP wired into chunk_size_kb (item 1). (c) CUBIC AIMD wired into per-peer inflight cap (item 3). (d) EWMV-derived per-peer timeout (item 7). (e) Beta-Thompson peer picker (item 2). Items 4, 5, 6, 8 exposed as Prometheus gauges only; integration in v10.9.45. CARRIES v10.9.43 SIMD wins (items 9-12, 14) + diagnostic INFO logs at block-pack handler branches. # v10.9.43: FIX v10.9.42 REGRESSION + add diagnostics. KEEP the working 0→26K sync path UNTOUCHED — fresh canaries consistently reach h=25,987-26,000 in ~16 min flat, proves the chunk scheduler/libp2p/validation/semaphore tuning is fundamentally correct. The problem is ONLY at the data-gap edge, NOT the sync engine. (1) REMOVE the 5s tokio::time::timeout on get_qblocks_forward — DeepSeek-suggested timeout cut off the EXACT code path that detects gaps; prod log v10.9.42 showed `⏱️ [BLOCK-PACK] get_qblocks_forward timed out (5s)` firing constantly with ZERO GAP-DECL emissions. The forward-seek scans through millions of blocks finding the next available; 5s is not enough on a 219 GB RocksDB. Forward-seek runs in a spawned task (block_pack_semaphore-gated) so it doesn't block the main loop; let it run as long as needed. (2) REVERT max_transmit_size 2 MB → 1 MB — gossipsub buffered larger messages caused the leak to ACCELERATE (NRestarts went from ~2/hr v10.9.41 → ~6/hr v10.9.42). (3) PRODUCER HEARTBEAT task: 60s tick, WARN with current tip height when no block produced in 60s — surfaces the wedged-producer secondary symptom we've been inferring from height-not-advancing. (4) tokio-console ENABLED BY DEFAULT so operators don't need a rebuild for diagnostics; runtime overhead ~3-5% accepted for the visibility win. (5) MORE DETAILED INFO logging in the block-pack handler: log forward-seek start/end, first_h, our_height, every code branch taken — so the next round of diagnosis doesn't need 30 min of speculation. Jemalloc heap profile build (suggested) deferred — switching global allocator is risky and v10.9.43 needs to ship fast. # v10.9.42: KILLER SOLUTION — broaden permanent_gap trigger so it ACTUALLY fires in production. v10.9.41 trigger condition (fast-path empty AND forward-seek skipped >10K) was unreachable in prod (live test 2026-05-17: 0 declarations in 30 min of two canaries hammering the gap). Fix: always probe forward-seek when fast-path returns less than `limit`, with a 5s timeout. If forward-seek first_h > start + 10K, emit permanent_gap and return early — regardless of fast-path partial state. Also (a) gossipsub backpressure config (send_queue_size=512, max_transmit_size=2MB, gossip_lazy=2, max_messages_per_rpc=1024) to slow the 110-150 MB/min memory leak in v10.9.41; (b) producer heartbeat task (60s tick, WARN if no block in 60s with current tip height for diagnostic value); (c) 3 new Prometheus counters (qnk_permanent_gap_declarations_sent_total, qnk_permanent_gap_declarations_received_total, qnk_permanent_gap_advances_applied_total) so operators can curl /metrics to confirm the fix is firing; (d) promote gap-declaration log from WARN to INFO. # v10.9.41: (Z) DeepSeek §0 forgery FIX in tip proof — pre-fix commitment was BLAKE3(transcript) only, allowing a malicious prover to substitute any (anchor, tip) values and pass verification. Fix: commit() now folds (anchor_height, anchor_state, tip_height, folded_state, transcript) into the keyed hash. Verifier recomputes from EXPECTED (anchor) + claimed (tip + folded_state + transcript) and checks against proof.commitment. Renamed proof_version "lattice-tip-v1" → "tip-blake3-fs-v1" per DeepSeek §1 (the actual reduction is BLAKE3 preimage = 128-bit Grover-quantum, NOT a lattice problem; "lattice-tip-vN" reserved for real Module-SIS in v10.10.0). Added version byte 0x01 to all hashed inputs per §2. New regression tests: rejects_deepseek_anchor_swap_forgery and rejects_tip_height_inflation cover the exact attack DeepSeek described. (A) PERMANENT-GAP TOLERANT SYNC — fixes "stuck at 26K" caused by network-wide loss of historical blocks 26,001..=100,440 from the pre-checkpoint pruning bug. New BlockPackResponse.permanent_gap: Option<(u64,u64)> field. Server (unified_network_manager.rs ~4060): when forward-seek lands more than MAX_FORWARD_SKIP=10K past the requested start_height, return an empty response with `permanent_gap = Some((start, first_h - 1))` (was returning silent empty in v10.9.38-v10.9.40). Client: tallies declarations per (start,end) tuple in `gap_declarations: HashMap<(u64,u64), HashSet<PeerId>>`. Once `Q_GAP_QUORUM` independent peers (default 2) corroborate a gap, the (start,end) is broadcast via `gap_advance_tx` so turbo_sync can advance `contiguous_height` past the unrecoverable hole. Operator override: `Q_GAP_TRUST_SINGLE_PEER=1` accepts a gap from any one peer (useful when only one node in the network has post-gap data). Diagnosed 2026-05-16 via tshark + Beta-and-Epsilon BLOCK-PACK forward-seek logs both showing the same 26K→100K skip — proving the gap is network-wide, not local. (B) RECURSIVE LATTICE TIP PROOF — — replaces the all-zeros placeholder at /api/v1/proof/tip with a real cryptographic proof a fresh bootstrapping node can verify in <10ms before beginning sync. New module q-recursive-proofs::tip_proof_v1: anchor() seeds a 64-byte Fiat-Shamir transcript from (anchor_height, anchor_state); extend() folds (prev_proof, new_block_header) into the transcript, then compresses to a 32-byte Ajtai-SIS commitment via BLAKE3 keyed mode (domain key "qnk-sis-commit-v1"). verify() recomputes the transcript-to-commitment hash + checks anchor binding — 0.3 ms on Epsilon's xeon-gold per measurement. wire size 176 bytes. PQ-secure (no curve/pairing math, soundness reduces to SIS + BLAKE3 collision). proof_version flips from "placeholder-v0" → "lattice-tip-v1-step" — wallets MUST upgrade their banner display per blueprint 5. Current handler ships a single-step proof (tip-1 → tip); chain-wide variant pending a producer hook on commit_block (deferred to producer-loop refactor). # v10.9.40: STRUCTURAL ROOT-CAUSE FIX for "stuck at 26K" — the actual bug. Deep tshark+ss analysis on Epsilon (2026-05-16): canary → prod TCP healthy (no RST/FIN, sustained 680-byte PSH+ACK every 10s), but prod's kernel Recv-Q at port 9001 accumulated 500+ KB per peer — production's libp2p task was NOT READING the sockets. Root cause: `unified_network_manager.rs:2844` has a `tokio::select! { biased; ... }` where `queue_drain_interval.tick()` at 1 ms interval (default MissedTickBehavior::Burst) was ALWAYS Ready, starving `self.swarm.select_next_some()` at slot #5. On a busy node generating 30+ gossipsub messages/sec, the queue_drain branch fired continuously; libp2p Swarm inbound stream reads never got a turn. Symptom matrix: qnk_peers_connected=0 in metrics, fork_detector "Only 0 peers connected", BUT the `[BLOCK-PACK]` handler logs ZERO entries despite canary repeatedly sending requests — confirming requests arrived at the TCP layer but never reached the libp2p Behaviour. Fix in this release: (a) queue_drain_interval 1 ms → 10 ms; (b) MissedTickBehavior::Skip on queue_drain + peer_scoring + health_check intervals (prevents 50-tick burst catch-up after a slow drain); 10ms * 10 msgs/batch = 1000 msg/s capacity, still 30× any realistic load. ALSO carries v10.9.39 fixes: (1) Gamma bootstrap peer ID refreshed at unified_network_manager.rs:259 (`WFfZKfKbBnB5...` → `WHNhCWYmUiGGG...` matching config.rs:398); (2) `[QUEUE DRAIN] Failed to publish` demoted WARN → DEBUG to stop journald saturation; (3) Node TUI sync card always renders + new "📡 Sync Stats (Prometheus + API)" panel + sliding-window 10s blocks-per-sec replacing cumulative-from-start average. # v10.9.39 prior body: (1) Refresh Gamma bootstrap peer at unified_network_manager.rs:259 — was `WFfZKfKbBnB5...`, now matches current `WHNhCWYmUiGGG...`. config.rs:398 was already updated; the network manager list was stale, so Epsilon's auto-dial of Gamma silently failed and the cross-server mesh never anchored — observable as `fork_detector: Only 0 peers connected` on prod even when canary reports `connected peers: 1`. (2) Demote `[QUEUE DRAIN] Failed to publish` from WARN to DEBUG: on a solo/low-peer node it fires 30+×/s (NoPeersSubscribedToTopic for miner-stats/mining-challenges/finality-certs), saturates journald, and exacerbates the libp2p starvation v10.9.36 already tried to fix. Root cause is metric-visible via peer_count=0 — the per-publish WARN was pure noise. (3) Node TUI sync card now always renders (was hidden once is_syncing flipped false at gap ≤50), with a new "📡 Sync Stats (Prometheus + API)" panel underneath: peers in/out, bandwidth rates+totals, APOLLO Kalman/PID, mining/API/integrity. Sliding-window 10s blocks-per-sec replaces the cumulative-from-process-start average that always read ~0 after a few hours uptime. # v10.9.38: ROOT-CAUSE FIX for "stuck at 26K" stall + carries v10.9.37 cap bump. Diagnosed via canary logs (q-sync-test-v10936) + Prometheus (qnk_local_height pinned at 26000, qnk_libp2p_rx_bytes_total ticking, height_progression flat): server's get_qblocks_forward() returns the first available block AT OR AFTER start_height. When there's a storage-format discontinuity (blocks 26001..100440 in an old format the DAG iterator can't traverse), it returns 100441+. Client's GAP_SKIP_REFUSED safety cap (10K) rejects these "200 blocks at heights 100441-105859" responses as too-far-from-contiguous → infinite retry of the same misaligned request. Fix at unified_network_manager.rs:~4041: refuse to return forward-seek blocks if first_height > start_height + 10K; treat as empty response (lets the gap-fill scheduler move the request window forward to where the server actually has data). v10.9.37: BLOCK-PACK CAP 200 → 2000. v10.9.36 proven (canary went 0 → 26K in 2.5 min = ~33 b/s sustained, past v10.9.28 stall) but throughput ceilinged at ~33 b/s because the server's per-response hard cap (line ~4006) caps blocks at 200 per response. With CLIENT_INFLIGHT_BLOCK_PACK_PER_PEER=16 and avg ~3s round-trip, 200×16÷3 ≈ 1066 b/s theoretical max but realistic ~33-66 b/s. Raising cap to 2000 (max 500 MB per response, well under 8 GB container) lifts ceiling to ~10,666 b/s theoretical. Tunable via Q_BLOCK_PACK_MAX env. Previous: v10.9.36: STRUCTURAL FIX (10ms→100ms run_once timeout). — bump run_once() outer-loop timeout 10ms→100ms (main.rs:6248). Code analytics 2026-05-16: 10ms polling slices were starving libp2p Swarm of continuous polling time needed to drive multi-round-trip Noise XX + Identify handshakes; peer mesh never forms (canary qnk_peers_connected=0 after 40+ min uptime even with Q_MAX_MEMORY_BYTES=64GiB env-var disabling memory_connection_limits gate). 100ms still well below the original v1.0.22 deadlock threshold (which was lock-held-forever, several MINUTES). Other tasks needing the manager lock will wait at most 100ms per iteration, vs ~10ms previously — 10x slower lock acquire but enough continuous polling for libp2p to complete handshakes. Carries forward all v10.9.31-35 work. Previous: v10.9.35: SWARM TRACE NOW IN run_once() (the ACTIVE driver). Deep-code analysis found main.rs:6250 calls nm.run_once(), NOT nm.run(). The v10.9.34 [SWARM-EVT] trace was placed in run() which is dead code — never executes. v10.9.35 adds the same [SWARM-EVT-RUN-ONCE] trace inside the run_once() Swarm dispatch arm (line ~5523) so the canary will actually emit trace lines on each Swarm event. This is what tells us if the loop is alive but inert vs dead entirely. v10.9.34: VERBOSE SWARM EVENT TRACING. Adds per-event-variant INFO log at the SwarmEvent dispatch entry (line ~3210 in unified_network_manager.rs) so we can see in canary logs WHICH SwarmEvent variants actually fire vs which never do — diagnoses the "libp2p mesh never forms" symptom where qnk_peers_connected stays at 0 and all libp2p_swarm_* metrics read 0. Logs labelled `[SWARM-EVT]` (variant name) and `[SWARM-EVT-BEHAVIOUR]` (behaviour type). Carries forward v10.9.33 self-dial filter, v10.9.32 metric wiring, v10.9.31 permits bump, and QUG add_liquidity counter. Previous: v10.9.33: BOOTSTRAP SELF-DIAL FILTER. Agent-A deep diagnostic (2026-05-16) found P1-4: Epsilon's own peer_id is in its own HARDCODED_BOOTSTRAP_PEERS list, so every bootstrap iteration spent a scheduler slot dialing itself, hit the [PEER CHECK] fast-fail at unified_network_manager.rs:6070, and emitted a noisy ERROR. New helper priority_ordered_bootstrap_filtered(map, local) filters out the local peer_id before returning the dial set; existing call site at line ~2377 switched over. Stops the self-dial spam and frees a scheduler slot per cycle. Carries forward v10.9.32 (metrics wiring), v10.9.31 (BLOCK_PACK_BASE_PERMITS 4→16), and the QUG add_liquidity debit-counter fix. Previous: v10.9.32: SYNC FIX + LIBP2P METRICS WIRED. Adds the diagnostic infrastructure that should have shipped with v10.9.27. The qnk_libp2p_rx_bytes_total + qnk_libp2p_tx_bytes_total + qnk_block_pack_response_bytes histogram were all DECLARED in metrics.rs but NEVER INCREMENTED anywhere in the codebase — every dashboard read 0 forever. Wired three increments in unified_network_manager.rs: server-side request receive (line ~3899), client-side response receive (line ~4047), server-side response send (line ~5449). Uses bincode::serialized_size for accurate byte counts. With these live, the next canary will tell us in 30s whether libp2p block-pack is actually carrying traffic vs the HTTP turbo-sync fallback. Carries forward v10.9.31's BLOCK_PACK_BASE_PERMITS 4→16 bump and the QUG add_liquidity debit-counter fix. v10.9.31:  SYNC THROUGHPUT FIX. (1) BLOCK_PACK_BASE_PERMITS bumped 4 → 16 in unified_network_manager.rs (line ~1125). Diagnosed via deep code analysis after v10.9.30 canary still synced at only ~13 b/s with qnk_libp2p_rx_bytes_total=0: the server-side block-pack handler at line ~3939 returns an EMPTY BlockPackResponse when the per-peer permit semaphore is exhausted, and the client cannot distinguish empty-because-saturated from empty-because-no-blocks-at-this-height — so it backs off retries on legitimate-looking misses. With v9.1.8's 200-block per-response cap (~50 MB max), 16 base permits = ~800 MB peak allocation (well under the 50 GB cgroup high-water mark). Lifts unsynced-server throughput from 4 concurrent block-packs to 16, and total fully-synced capacity from 16 to 28 (16 base + 12 extra). (2) Includes the QUG add_liquidity debit-counter fix: liquidity_api.rs::add_liquidity now calls record_dex_qug_debit on both native-QUG paths so LP deposits survive on-chain replay (apply_dex_qug_adjustments idempotency restored). (3) MUST cargo clean --package q-api-server before building this release so the API-reported version actually reads 10.9.31, not the cached prior string. Previous: v10.9.30: LIBP2P PEER-ADDR CACHE FIX. Wireshark+log forensics on Epsilon Docker (v10.9.29 stalled at 26K) revealed real cause: [PEER CHECK] in unified_network_manager.rs:6040 reads from self.peer_addresses, which was constructed as empty HashMap at line 2675 even though bootstrap-resolution built fully-populated `all_peer_addresses` (Epsilon /ip4/89.149.241.126/tcp/9001, Beta, Gamma, Delta). Bootstrap addrs flowed into Kademlia DHT but NOT into the cache the block-pack scheduler consults — every chunk targeting Epsilon (only peer with full historical chain) hit "NOT connected and has NO cached address!" and round-robin'd to random tip peers whose block-pack returns empty for ranges <18M. Fix (one line): seed peer_addresses from all_peer_addresses.clone() at construction. PLUS: QNarwhalEvent::Identify(Received) was previously debug-logged and discarded — now inserts info.listen_addrs into peer_addresses so we keep learning addresses post-bootstrap. v10.9.29 chunk-end-clip stays in place (verified working: height 0 → 26K past v10.9.28 plateau). Previous: v10.9.29: SYNC CHUNK-END CLIP + BALANCE INTEGRITY. (1) Genesis-window cap now clips chunk END to window_cap, not just filters by chunk start — fixes v10.9.28 stall at 26K where a single oversized chunk (ML predictor picked huge size) spanned 26K→18M, passed the start≤cap filter, then failed ingest because the response body covered heights far beyond the 10K window. With end-clipping every dispatched chunk's response is guaranteed ingestable. Applied to all 3 cap sites (split_into_chunks, gap-fill, sync_to_height). (2) CRITICAL: save_wallet_balance (singular) now has max-wins guard per CLAUDE.md Rule 1. Stale writes that would LOWER a balance are now SKIPPED with ERROR log, on-disk value preserved. The plural save_wallet_balances had this guard but the singular form was missing it — production was observing 5% balance fluctuation on Epsilon because of this gap. Previous: v10.9.28: SYNC INGESTION FIX + METRIC WIRING. (1) Q_GENESIS_LOOKAHEAD_BLOCKS default lowered 1M → 10K to match the pre-existing GAP_SKIP_REFUSED ingestion safety cap — v10.9.27 dispatched chunks within 1M of contiguous but >90% got refused at ingest with "Gap exceeds safety cap 10000", causing 0 height advance + 50MB/min RSS leak from the retry-storm. With 10K window, every dispatched chunk is ingestable. (2) Wired qnk_local_height + qnk_blocks_synced_total gauges from the existing 5s height reconciler so /metrics emits an honest sync-progress signal (was stuck at 0 in v10.9.27 due to missing callers). Remaining metric wiring (chunks_in_flight, retry_total, bootstrap_dial, block_pack_request, libp2p_swarm_*) tracked as follow-up commits — those need turbo_sync + unified_network_manager hooks. Previous: v10.9.27: "WORKS OUT OF THE BOX" — auto-defaults for fresh nodes (Q_GENESIS_SYNC_ONLY + Q_SKIP_CHECKPOINT auto-set when DB is empty), P2P port 9001 auto-fallback to 9100-9999 on EADDRINUSE, comprehensive Prometheus /metrics endpoint (qnk_peers_connected, qnk_block_pack_request_total, qnk_chunk_retry_total, libp2p_swarm_connections_closed_total{cause} — see crates/q-network/src/metrics.rs), client-side per-peer block-pack semaphore (CLIENT_INFLIGHT_BLOCK_PACK_PER_PEER=4) + retry-storm dampener (ClientThrottle errors don't consume retry budget), libp2p memory-connection-limits behaviour wired (1 GiB default, Q_MAX_MEMORY_BYTES tunable), connection-close WARN diagnostic with cause string (journalctl-visible at Epsilon's WARN level), banner network_id resolution fixed to match runtime (env-first, not clap-default-first). Diagnostic-by-curl: `curl :PORT/metrics | grep libp2p_swarm_connections_closed_total` shows close reasons; `qnk_bootstrap_dial_total{result="failed"}` shows dial outcomes; `qnk_block_pack_request_total{direction="out",result="throttle"}` shows client back-pressure. Previous: v10.9.26: GENESIS-WINDOW SCHEDULER (FULL COVERAGE). v10.9.25 only patched sync_to_height; multiple other chunk-building call sites (split_into_chunks at line 4167, gap-fill at line 3576+) bypassed the cap and produced requests at heights > local + 1M, causing the "synced 26k blocks then stops" symptom on Beta + Epsilon docker tests. Both v10.9.25 and v10.9.26 honor Q_GENESIS_SYNC_ONLY=1. Previous: v10.9.25: GENESIS-WINDOW SCHEDULER. Fixes "synced 4045 blocks then gravity-assist spins forever" pattern in genesis mode. When Q_GENESIS_SYNC_ONLY=1, turbo_sync.rs::sync_to_height filters the chunk set to chunks within Q_GENESIS_LOOKAHEAD_BLOCKS (default 1M) of contiguous height. Without the cap, gravity-assist's parallel streams were saving blocks at heights 6M, 9M, 13M while the contiguous chain crawled forward from genesis at ~22 bps — wasting bandwidth on blocks that couldn't unblock progress until the gap below filled. With the cap, every in-flight chunk directly extends the contiguous chain. Checkpoint and endgame modes unaffected. Previous: v10.9.24: SYNC-UNWEDGE FIXES. (1) qblock:latest pointer heal at startup — if scan_highest_contiguous returns N > current qblock:latest, force qblock:latest = N. Unsticks turbo-sync request building after a checkpoint apply (was producing range:0-0 forever because pointer-cap could never walk past gap). (2) Readiness ArchiveComplete now requires `contiguous >= max(local_tip, peer_max_height)` AND at least one peer-height-proof seen — fixes premature ArchiveComplete at 21k blocks when peer-heights haven't propagated yet. Previous: v10.9.22: SYNC-LIVE FIX. Stops the mining-rejection feedback loop that wedged Epsilon (1342% CPU / 52GB RSS / VDF spawn_blocking timeouts). Two changes: (1) handlers.rs:9794 — rate-limit the 503 mining-reject `warn!` to once per 30s (was firing 2K+/sec with 400 miners, matching the success-log rate-limit at line 9837). (2) main.rs:25321 — custom TraceLayer on_failure that suppresses ERROR logs for 503 SERVICE_UNAVAILABLE so tower stops doubling the storm. Together these prevent the journald-saturation → libp2p-starvation cascade that left Epsilon perpetually 10K+ blocks behind tip and unable to serve new-node bootstrap. Previous: v10.9.21: HONEST LIQUIDITY. bootstrap_bridge_pools no longer auto-mints unbacked wBTC at boot — pools start as empty shells; real LPs must deposit. handlers.rs swap path returns "No wBTC liquidity yet — be the first LP" instead of silently trading against fake supply. NEW one-click LP flow: POST /api/v1/bitcoin/lp/intent escrows QUG, generates Knots deposit address, and on finalize atomically mints wBTC + pulls escrowed QUG + adds liquidity, minting LP tokens to the user (cancel/refund + finalize/list/get endpoints, LP intent persisted in CF_MANIFEST under btc_lp_intent:*). Frontend gains a "Bridge LP" tab in BitcoinSwapModal with the wizard. Previous: v10.9.20: wBTC reserve check gated on `use_oracle` so AMM-pool swaps work without a configured Bitcoin bridge. bootstrap_bridge_pools preserves traded reserves across restarts (only reseeds when drained below 1% of bootstrap). /api/v1/bitcoin/withdraw gains real bitcoin::Address mainnet validation + optional fee_priority (economy/normal/fast → Knots conf_target 30/6/2). DepositBridge::send_to_address_with_target + send_withdrawal(conf_target). Frontend BitcoinSwapModal: real user-pasted compressed BTC pubkey required for HTLC swaps (no more fake 0x02||qnk_addr fabrication); confirmation text 3→6 blocks to match BTC_MIN_CONFIRMATIONS. sendBitcoin() in services/api.ts now hits the real /v1/bitcoin/withdraw instead of the nonexistent /v1/bitcoin/send.  Previous: v10.9.19: huge "hum" release. (1) Track A TUI readiness banner Bootstrapping/FastReady/CheckpointTrust/GenesisSync/ArchiveComplete. (2) GET /api/v1/engine/pulse — comprehensive live vitals JSON with sync heights, mining counters, P2P bytes, mempool size, gap-to-tip, wallet count, decentralization EMA. (3) GET /api/v1/proof/tip — Phase 1 placeholder recursive-SNARK endpoint (wallet integration unblocked). (4) K-parameter gauge extended to 5 cards with new Engine Pulse column (data integrity / quorum / API count / P2P). (5) Boot tracker step 10 shows Q_BOOTSTRAP_MIN_PEERS knob. (6) HEALTH log cosmetic fix — "unbounded" instead of "0.0G (0%)" when cgroup has no limit. (7) Phase 2 trigger requires 3 consecutive ready ticks (~90s) before firing to avoid false-positives on small peer sets. (8) max_established_per_peer raised 2→4, tunable via Q_MAX_CONNS_PER_PEER. New q-ivc-verifier-wasm Phase 1 scaffold crate. DeepSeek job-board doc shipped covering Jobs A-K. Track C dilithium fixtures + Track D network instrumentation still deferred (submitted patches had compile/math issues).
