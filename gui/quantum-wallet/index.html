<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quillon Graph • $QUG</title>
    <script>
    /* TEMP HIDE wrapped bridge tokens (wBTC/wZEC/wIRON/wETH) from dashboard + DEX.
       Reversible: delete this entire <script> block to restore. rocky 2026-06-28
       Lives in the Vite source so rebuilds preserve it (mirrors the Epsilon dist-final hotfix). */
    (function(){
      if(window.__qHideWrapped)return; window.__qHideWrapped=1;
      var HIDE=new Set(["wbtc","wzec","wiron","weth"]);
      var of=window.fetch?window.fetch.bind(window):null; if(!of)return;
      window.fetch=function(i,init){
        var u=(typeof i==="string"?i:(i&&i.url))||"";
        var p=of(i,init);
        if(!/(dex\/tokens|liquidity\/pools|dex\/pools)(\?|$)/.test(u))return p;
        return p.then(function(r){
          return r.clone().json().then(function(j){
            if(j&&Array.isArray(j.data)){
              j.data=j.data.filter(function(it){
                var s=(it.symbol||"").toLowerCase(),
                    a=(it.token0||"").toLowerCase(),
                    b=(it.token1||"").toLowerCase();
                return !HIDE.has(s)&&!HIDE.has(a)&&!HIDE.has(b);
              });
            }
            return new Response(JSON.stringify(j),{status:r.status,statusText:r.statusText,headers:{"content-type":"application/json"}});
          }).catch(function(){return r;});
        });
      };
    })();
    </script>
    <script>
    /* ADAPTIVE FIT-TO-WIDTH ZOOM — RETIRED 2026-09-23.
       It applied a CSS `zoom` to #root scaled to viewport/3840, to make a layout
       believed to be drawn for 4K fit a smaller screen. Measured on the live site
       before removing it: at zoom 1.0 the app's content width equals the viewport
       exactly at 1280, 1366, 1440, 1600, 1920 and 2560 — zero horizontal overflow
       at any of them. The layout is already responsive; there was no 4K layout to
       rescue.

       What the zoom actually did was change the EFFECTIVE CSS viewport: at 0.40 the
       layout believed the screen was 3600 px, laid itself out for that, and was then
       scaled down to 40 %. A 16 px label rendered as 6.4 px on a 1440 laptop.

       It also split the UI into two scales, because body-level portals (every modal
       in components/ uses createPortal) escape a #root zoom and render at real
       pixels. App chrome at 0.40, modals at 1.00, on the same screen.

       Reinstate by restoring index.html from
       sigil-scratch/index.html.bak-prezoom-* if a genuinely fixed-width screen
       ever needs it. rocky 2026-07-02, retired 2026-09-23 */
    </script>
  </head>
