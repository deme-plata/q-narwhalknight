[package]
name = "slint-wallet"
version.workspace = true
edition = "2021"
description = "Q-NarwhalKnight Native Wallet - Slint GUI"
license = "MIT"

[features]
default = ["gpu-opencl"]
gpu-opencl = ["opencl3"]

[dependencies]
slint = { version = "1.9", features = ["renderer-software"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
sha2 = "0.10"
sha3 = "0.10"
base64 = "0.22"
blake3 = { version = "1.5", features = ["prefer_intrinsics"] }
bip39 = "2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
futures-util = "0.3"
futures = "0.3"
eventsource-client = "0.12"
self-replace = "1.5"
semver = "1"
arboard = "3"
qrcode = "0.14"
tiny_http = "0.12"
urlencoding = "2"
num_cpus = "1.16"
core_affinity = "0.8"
raw-cpuid = "11"
opencl3 = { version = "0.9", optional = true }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["processthreadsapi", "sysinfoapi", "winnt"] }

[build-dependencies]
slint-build = "1.9"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
