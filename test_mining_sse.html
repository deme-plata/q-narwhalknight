<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mining SSE Test - Q-NarwhalKnight</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #0a0e27;
            color: #00ff88;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: #00ddff;
            text-shadow: 0 0 10px #00ddff;
        }
        .status {
            background: #1a1e37;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #00ff88;
        }
        .event-log {
            background: #0d1124;
            padding: 15px;
            border-radius: 8px;
            max-height: 500px;
            overflow-y: auto;
            font-size: 12px;
            border: 1px solid #444;
        }
        .mining-reward {
            background: #1a3d1a;
            border-left: 4px solid #00ff88;
            padding: 10px;
            margin: 5px 0;
            border-radius: 4px;
        }
        .event-item {
            background: #1a1e37;
            border-left: 4px solid #0088ff;
            padding: 10px;
            margin: 5px 0;
            border-radius: 4px;
        }
        .timestamp {
            color: #888;
            font-size: 10px;
        }
        .connected {
            color: #00ff88;
            font-weight: bold;
        }
        .disconnected {
            color: #ff4444;
            font-weight: bold;
        }
        .balance {
            font-size: 24px;
            color: #ffaa00;
            text-shadow: 0 0 10px #ffaa00;
        }
        .reward-count {
            color: #00ddff;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💎 Q-NarwhalKnight Mining SSE Test</h1>

        <div class="status">
            <h2>SSE Connection Status: <span id="connection-status" class="disconnected">Disconnected</span></h2>
            <p><strong>Miner Wallet:</strong> qnk048394c4a54b944b1d457220288bc58062dbe145673bea428b2b10238a8dd15d</p>
            <p><strong>Total Balance:</strong> <span class="balance" id="total-balance">0.00</span> QNK</p>
            <p><strong>Mining Rewards Received:</strong> <span class="reward-count" id="reward-count">0</span></p>
            <p><strong>Last Reward:</strong> <span id="last-reward">Waiting...</span></p>
        </div>

        <h3>📊 Event Log</h3>
        <div class="event-log" id="event-log">
            <div class="event-item">Starting SSE connection...</div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8090';
        const MINER_WALLET = 'qnk048394c4a54b944b1d457220288bc58062dbe145673bea428b2b10238a8dd15d';

        let eventSource = null;
        let rewardCount = 0;
        let currentBalance = 0;

        function log(message, type = 'info') {
            const eventLog = document.getElementById('event-log');
            const eventDiv = document.createElement('div');
            eventDiv.className = type === 'mining_reward' ? 'mining-reward' : 'event-item';

            const timestamp = new Date().toLocaleTimeString();
            eventDiv.innerHTML = `<span class="timestamp">${timestamp}</span> ${message}`;

            eventLog.insertBefore(eventDiv, eventLog.firstChild);

            // Keep only last 100 events
            while (eventLog.children.length > 100) {
                eventLog.removeChild(eventLog.lastChild);
            }
        }

        function updateStatus(connected) {
            const statusEl = document.getElementById('connection-status');
            statusEl.textContent = connected ? 'Connected ✅' : 'Disconnected ❌';
            statusEl.className = connected ? 'connected' : 'disconnected';
        }

        function connectSSE() {
            log('🔌 Connecting to SSE endpoint: ' + API_URL + '/api/v1/events');

            eventSource = new EventSource(API_URL + '/api/v1/events');

            eventSource.onopen = () => {
                log('✅ SSE connection established');
                updateStatus(true);
            };

            eventSource.onerror = (error) => {
                log('❌ SSE connection error: ' + error, 'error');
                updateStatus(false);

                // Reconnect after 5 seconds
                setTimeout(() => {
                    log('🔄 Attempting to reconnect...');
                    connectSSE();
                }, 5000);
            };

            // Listen for mining_reward events
            eventSource.addEventListener('mining_reward', (event) => {
                try {
                    const data = JSON.parse(event.data);
                    console.log('💎 Mining reward received:', data);

                    // Check if this reward is for our wallet
                    if (data.miner_address === MINER_WALLET) {
                        rewardCount++;
                        currentBalance = data.new_balance_qnk || currentBalance;

                        document.getElementById('reward-count').textContent = rewardCount;
                        document.getElementById('total-balance').textContent = currentBalance.toFixed(8);
                        document.getElementById('last-reward').textContent =
                            `${data.reward_qnk} QNK (Nonce: ${data.nonce})`;

                        log(`💎 Mining Reward! +${data.reward_qnk} QNK (Balance: ${currentBalance.toFixed(8)} QNK) - Nonce: ${data.nonce}`, 'mining_reward');
                    }
                } catch (e) {
                    log('⚠️ Error parsing mining_reward event: ' + e.message);
                    console.error('Parse error:', e, 'Event data:', event.data);
                }
            });

            // Listen for generic message events
            eventSource.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    log(`📨 Event received: ${data.type || 'unknown'}`);
                } catch (e) {
                    log(`📨 Raw event: ${event.data.substring(0, 100)}...`);
                }
            };
        }

        // Start SSE connection
        connectSSE();

        // Log every 10 seconds to show we're alive
        setInterval(() => {
            log(`⏰ Still connected and listening for mining rewards (${rewardCount} received so far)`);
        }, 10000);
    </script>
</body>
</html>
